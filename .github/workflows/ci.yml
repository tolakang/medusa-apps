# CI gate (BUILD_PLAN.md §3.3, §8; docs/DEV_FLOW.md §10). One verify job per
# deployable; add a matrix entry when a new deployable gets app code.
# Branch protection requires only `ci-ok` (bottom), which needs every job.
name: ci

on:
  pull_request:
    # labeled / unlabeled: the owner's `plan-revision` label re-runs guard.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # guard diffs against .guard-baseline / origin/main
      - name: Guardrails (DEV_FLOW Gate 5)
        env:
          # Only the owner adds this label to a PR that revises the plan
          # (docs/PLAN_LOCK.md; REVIEW_FIXES T1).
          PLAN_REVISION_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'plan-revision') }}
        run: scripts/guard.sh all

  verify:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployable:
          - ecommerce/backend
          - ecommerce/storefront
          - pos/backend
          - pos/storefront
          - pos/pos-app
          - booking-services/backend
          - booking-services/storefront
          - wholesale/backend
          - wholesale/storefront
          - reseller/backend
          - reseller/storefront
          - reseller/seller-portal
    services:
      postgres:
        image: docker.io/library/postgres:15-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa
          POSTGRES_DB: verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medusa" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: medusa
      DB_PASSWORD: medusa
      CONTAINER_CLI: docker
      VERIFY_DOCKER_NETWORK: host
      VERIFY_DATABASE_URL: postgres://medusa:medusa@localhost:5432/verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ matrix.deployable }}/package.json # pnpm version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.deployable }}/pnpm-lock.yaml
      - name: Verify (DEV_FLOW Gates 1-4)
        run: scripts/verify.sh ${{ matrix.deployable }} --image

  # The one check the `protect main` ruleset requires (owner, 2026-11-04).
  # It passes only when guard and every verify matrix job passed, so a new
  # deployable added to the matrix is covered without editing the ruleset,
  # and PR auto-merge waits for the whole CI. `if: always()` makes it run
  # (and fail) when a needed job failed or was skipped, instead of being
  # skipped itself, which a required check would treat as passing.
  ci-ok:
    needs: [guard, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          GUARD: ${{ needs.guard.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "guard: $GUARD, verify: $VERIFY"
          test "$GUARD" = success && test "$VERIFY" = success
