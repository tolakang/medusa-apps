# Weekly Medusa update check (BUILD_PLAN.md §8 automation; see TASKS.md
# finding F-008: Dependabot supports pnpm v7-v10 only, this repo pins pnpm 12).
# Fails (visible red run) when any deployable pins an older Medusa than npm
# `latest`. Fix with: scripts/update-medusa.sh <category> on a branch.
name: medusa-update-check

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Compare pinned @medusajs/medusa and @medusajs/js-sdk with npm latest
        run: |
          LATEST=$(npm view @medusajs/medusa version)
          echo "npm latest: $LATEST"
          OUTDATED=0
          for f in */backend/package.json */storefront/package.json */*-portal/package.json */pos-app/package.json; do
            [ -f "$f" ] || continue
            PINNED=$(node -e 'const p=require("./"+process.argv[1]);const d={...p.dependencies,...p.devDependencies};console.log(d["@medusajs/medusa"]||d["@medusajs/js-sdk"]||"")' "$f")
            [ -n "$PINNED" ] || continue
            if [ "$PINNED" != "$LATEST" ]; then
              echo "::warning file=$f::pins $PINNED, latest is $LATEST"
              OUTDATED=1
            else
              echo "ok  $f ($PINNED)"
            fi
          done
          [ "$OUTDATED" = 0 ] || { echo "Run scripts/update-medusa.sh (read the release notes first)."; exit 1; }
