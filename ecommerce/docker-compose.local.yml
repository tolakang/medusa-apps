# ecommerce: whole business project for LOCAL testing (BUILD_PLAN.md §4.3).
# Dokploy ignores this file. Images and ports are local-only.
#
#   podman compose -f ecommerce/docker-compose.local.yml up -d --build   (or: docker compose …)
#   admin user:  podman exec ecommerce-local-backend docker-entrypoint.sh medusa user -e admin@example.com -p supersecret
#
# Host ports are offset to avoid clashing with other local databases.
name: ecommerce-local

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ecommerce-local-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: ecommerce
    ports: ["55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d ecommerce"]
      interval: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ecommerce-local-redis
    ports: ["56379:6379"]

  backend:
    build: ./backend
    container_name: ecommerce-local-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["9000:9000"]
    # No curl in the slim image; Node 22 has fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 60
    environment: &backend-env
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/ecommerce
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      MEDUSA_FF_CACHING: "true"
      JWT_SECRET: local-only-jwt-secret
      COOKIE_SECRET: local-only-cookie-secret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000,http://localhost:8000
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      RUN_MIGRATIONS: "true"

  worker:
    build: ./backend
    container_name: ecommerce-local-worker
    # Worker starts only after the server has migrated and is healthy
    # (same order as the Dokploy first deploy, BUILD_PLAN.md §5).
    depends_on:
      backend: { condition: service_healthy }
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      RUN_MIGRATIONS: "false"

volumes:
  postgres_data:
